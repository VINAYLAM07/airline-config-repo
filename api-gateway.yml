spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

              filters:
                - StripPrefix=1

            - id: flight-service
              uri: lb://FLIGHT-SERVICE
              predicates:
                - Path=/api/flights/**

              filters:
                - StripPrefix=1
            - id: booking-service
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/bookings/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

  endpoint:
    gateway:
      access: read-only

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: DEBUG

jwt:
  secret: ${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234}