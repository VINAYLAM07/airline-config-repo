spring:
  cloud:
    gateway:
      mvc:
        routes:

          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/auth/**

            filters:
              - StripPrefix=1

          - id: flight-service
            uri: lb://FLIGHT-SERVICE
            predicates:
              - Path=/api/flights/**

            filters:
              - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info