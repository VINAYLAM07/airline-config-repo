server:
  port: 8082

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/flightdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  secret: 1234567890123456789012345678901234567890123456789012345678901234
